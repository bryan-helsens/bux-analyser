[project]
name = "bux-analyser"
version = "0.1.0"
description = "Local-first personal investment intelligence platform for a BUX portfolio"
requires-python = ">=3.11"
dependencies = [
  "pandas>=2.2",
  "numpy>=1.26",
  "sqlalchemy>=2.0",
  "yfinance>=0.2.50",
  "requests>=2.31",
  "streamlit>=1.35",
  "plotly>=5.20",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.setuptools.packages.find]
include = ["bux_analyser*"]
